[project]
name = "usgs-earthquakes-workspace"
version = "0.1.0"
description = "USGS earthquake workspace with incremental loading and freshness cascade"
requires-python = ">=3.12"
dependencies = [
    "dlt[motherduck,parquet,hub]>=1.27.0",
    "altair>=6.0.0",
    "numpy",
    "pandas",
    "ibis-framework>=10.0.0",
    "pydbml>=1.2.0",

]

[dependency-groups]
ibis = ["ibis-framework[duckdb]"]

[tool.uv.sources]
